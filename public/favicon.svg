<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="playingCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Outer Playing Card Body -->
  <rect x="20" y="10" width="60" height="80" rx="8" fill="url(#playingCardBg)" stroke="#2563eb" stroke-width="4" />

  <!-- Inner Artwork Frame -->
  <rect x="28" y="18" width="44" height="40" rx="4" fill="#ffffff" />

  <!-- Center Pokeball/Emblem -->
  <circle cx="50" cy="38" r="11" fill="#2563eb" />
  <circle cx="50" cy="38" r="4" fill="#ffffff" />
  <line x1="39" y1="38" x2="61" y2="38" stroke="#ffffff" stroke-width="2" />

  <!-- Card Stat Lines -->
  <rect x="28" y="66" width="30" height="4" rx="2" fill="#e2e8f0" />
  <rect x="28" y="74" width="20" height="4" rx="2" fill="#94a3b8" />
  <circle cx="66" cy="70" r="4" fill="#2563eb" />
</svg>